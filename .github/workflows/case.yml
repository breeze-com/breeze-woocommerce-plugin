# CASE — mention/label trigger (HARDENED Jun 16; MINTER 18 Sep 2026).
# No App private key lives in this repo any more. The job proves who it is with
# its GitHub OIDC token and asks the CASE minter (Cloud Run, breeze-it-tools,
# IAM-gated) for two things: an installation token for THIS repo only, and hub
# reads/writes done on its behalf on a path allowlist (its own memory file, a
# ledger append). The agent runs with the repo token; it never holds anything
# that reaches the hub or another repo. Rails ride in this workflow.
name: CASE

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write   # the OIDC token IS the credential now (WIF + minter)

concurrency:
  group: case-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  case:
    if: >-
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'case'
      ) || (
        github.event_name != 'issues' &&
        contains(github.event.comment.body, '/case') &&
        contains(fromJSON('["MEMBER","OWNER"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Google identity for the minter (WIF → case-minter-caller)
        id: gauth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1012842080261/locations/global/workloadIdentityPools/github-case/providers/github
          service_account: case-minter-caller@breeze-it-tools.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://case-minter-1012842080261.asia-southeast1.run.app
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Minter client (functions only; tokens stay in step env, never on disk)
        run: |
          mkdir -p "$RUNNER_TEMP/case"
          cat > "$RUNNER_TEMP/case/minter.sh" <<'SH'
          MINTER="https://case-minter-1012842080261.asia-southeast1.run.app"
          _ghjwt() {
            curl -sS -f -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=case-minter" | jq -r .value
          }
          # minter_token -> prints an installation token for THIS repo only
          minter_token() {
            curl -sS -f -X POST "$MINTER/token" -H "Authorization: Bearer $GID" \
              -H "X-GitHub-OIDC: $(_ghjwt)" -H 'Content-Type: application/json' -d '{}' | jq -r .token
          }
          # minter_hub <get|put|append> <hub-path> [local-file] [message] -> prints the JSON reply
          minter_hub() {
            local body
            if [ -n "${3:-}" ]; then
              body=$(jq -n --arg op "$1" --arg p "$2" --arg c "$(base64 -w0 < "$3")" --arg m "${4:-}" \
                     '{op:$op,path:$p,content_b64:$c,message:$m}')
            else
              body=$(jq -n --arg op "$1" --arg p "$2" '{op:$op,path:$p}')
            fi
            curl -sS -f -X POST "$MINTER/hub" -H "Authorization: Bearer $GID" \
              -H "X-GitHub-OIDC: $(_ghjwt)" -H 'Content-Type: application/json' -d "$body"
          }
          SH

      - name: Mint repo token (this repo only; the key never leaves the minter)
        id: app-token
        env:
          GID: ${{ steps.gauth.outputs.id_token }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/case/minter.sh"
          TOK=$(minter_token)
          [ -n "$TOK" ] && [ "$TOK" != "null" ] || { echo "::error::minter returned no token"; exit 1; }
          echo "::add-mask::$TOK"
          echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Write CASE permission policy (workflow-borne, run-scoped)
        run: |
          mkdir -p "$RUNNER_TEMP/case"
          cat > "$RUNNER_TEMP/case/settings.json" <<'JSON'
          {
            "permissions": {
              "allow": [
                "Read", "Glob", "Grep", "Edit", "Write",
                "Bash(npm test:*)", "Bash(npm run:*)", "Bash(npm ci:*)", "Bash(npm install:*)",
                "Bash(npx vitest:*)", "Bash(npx jest:*)", "Bash(npx tsc:*)", "Bash(node:*)",
                "Bash(python3:*)", "Bash(pytest:*)", "Bash(python3 -m pytest:*)", "Bash(pip install:*)",
                "Bash(go test:*)", "Bash(cargo test:*)", "Bash(dotnet test:*)",
                "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)",
                "Bash(git checkout:*)", "Bash(git switch:*)", "Bash(git branch:*)",
                "Bash(git add:*)", "Bash(git commit:*)", "Bash(git push:*)",
                "Bash(gh pr create:*)", "Bash(gh pr list:*)", "Bash(gh pr view:*)",
                "Bash(gh issue list:*)", "Bash(gh issue view:*)", "Bash(gh issue comment:*)"
              ],
              "deny": [
                "Edit(.github/workflows/**)", "Write(.github/workflows/**)", "Read(.github/workflows/**)",
                "Read(.env)", "Read(**/.env)", "Read(**/.env.*)", "Read(.env.*)",
                "Read(**/*.pem)", "Read(**/*.key)", "Read(**/*.p12)", "Read(**/*.pfx)",
                "Read(**/.npmrc)", "Read(**/.netrc)", "Read(**/service-account*.json)",
                "Read(**/*secret*)", "Read(**/*credential*)",
                "Bash(git merge:*)", "Bash(git push --force:*)", "Bash(git push -f:*)", "Bash(git remote:*)",
                "Bash(curl:*)", "Bash(wget:*)", "Bash(nc:*)", "Bash(ncat:*)", "Bash(scp:*)",
                "WebFetch", "WebSearch"
              ]
            }
          }
          JSON

      - name: Fetch CASE memory from hub (via the minter)
        env:
          GID: ${{ steps.gauth.outputs.id_token }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -uo pipefail
          . "$RUNNER_TEMP/case/minter.sh"
          mkdir -p .case
          if R=$(minter_hub get "memory/${REPO_NAME}.md") && [ "$(jq -r .found <<<"$R")" = "true" ]; then
            jq -r .content_b64 <<<"$R" | base64 -d > .case/memory.md
          else
            echo "(no memory file yet — first run)" > .case/memory.md
          fi
          cp .case/memory.md .case/memory.orig.md

      - name: Run CASE
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          trigger_phrase: "/case"
          allowed_bots: "breeze-case-bridge,breeze-case-bridge-core"
          label_trigger: "case"
          branch_prefix: "case/"
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 50
            --settings ${{ runner.temp }}/case/settings.json
            --append-system-prompt "You are CASE, a governed coding agent. You open PRs for human review and NEVER merge; branch prefix 'case/'. Do not touch .github/workflows, secrets, deploy config, or the case hub repo. If your task came from an issue (label trigger) and you completed code work: after pushing your branch you MUST open the pull request yourself with 'gh pr create' (allowlisted), titled '[CASE] ...' and including 'Closes #<issue>'. Never finish by offering a compare/create-PR link."

      - name: Sync CASE memory + ledger to hub (via the minter; policed paths)
        if: always() && steps.gauth.outputs.id_token != ''
        env:
          GID: ${{ steps.gauth.outputs.id_token }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Write-back is non-critical: a hiccup logs a ::warning:: but never reds the run.
          set -uo pipefail
          . "$RUNNER_TEMP/case/minter.sh"
          if [ -f .case/memory.md ] && ! cmp -s .case/memory.md .case/memory.orig.md; then
            minter_hub put "memory/${REPO_NAME}.md" .case/memory.md "run ${{ github.run_id }}" >/dev/null \
              && echo "hub: memory updated" || echo "::warning::hub memory write failed"
          fi
          if [ -s .case/ledger-row.md ]; then
            minter_hub append "ledger.md" .case/ledger-row.md "run ${{ github.run_id }}" >/dev/null \
              && echo "hub: ledger appended" || echo "::warning::hub ledger append failed"
          fi

      - name: Report run failure on the triggering thread
        # Closes the silent-death gap: if any step above failed, tell the
        # requester on the issue/PR that summoned CASE. Posts as the breeze-case
        # App (repo-scoped token) — body has no "/case", so it cannot self-trigger.
        if: failure() && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          NUM="${{ github.event.issue.number || github.event.pull_request.number }}"
          [ -z "$NUM" ] && exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh api "repos/${{ github.repository }}/issues/${NUM}/comments" \
            -f body="CASE run failed: ${RUN_URL} — the request did not complete. cc the requester if one is named in the issue body." >/dev/null \
            || echo "::warning::could not post failure comment"
