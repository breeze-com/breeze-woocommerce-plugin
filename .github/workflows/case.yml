# CASE — mention/label trigger (HARDENED Jun 16; MINTER 18 Sep 2026).
# No App private key lives in this repo any more. The job proves who it is with
# its GitHub OIDC token and asks the CASE minter (Cloud Run, breeze-it-tools,
# IAM-gated) for two things: an installation token for THIS repo only, and hub
# reads/writes done on its behalf on a path allowlist (its own memory file, a
# ledger append). The agent runs with the repo token; it never holds anything
# that reaches the hub or another repo. Rails ride in this workflow.
name: CASE

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read
  issues: write    # only so the failure reporter can still speak when no token was minted (25 Sep 2026)
  id-token: write   # the OIDC token IS the credential now (WIF + minter)

concurrency:
  group: case-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  case:
    # Who may trigger by comment: org members/owners typing /case (the
    # review-to-fix loop, Jun 16 2026), and CASE's own two bridge Apps (30 Sep
    # 2026): a follow-up ask in a Slack thread that already has an open CASE PR
    # is relayed by the bridge as a /case comment ON that PR, so the fix lands on
    # the existing branch instead of a fresh PR off main. Four divergent PRs on
    # one demo in an hour is what this line prevents. The bridge comments only
    # from its envelope-gated tool loop (a workspace member asked), and the
    # action's allowed_bots below already trusts the same two Apps on the label
    # path. Never add breeze-case itself here: self-trigger loop.
    if: >-
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'case'
      ) || (
        github.event_name != 'issues' &&
        contains(github.event.comment.body, '/case') &&
        (
          contains(fromJSON('["MEMBER","OWNER"]'), github.event.comment.author_association) ||
          contains(fromJSON('["breeze-case-bridge[bot]","breeze-case-bridge-core[bot]"]'), github.event.comment.user.login)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Google identity for the minter (WIF → case-minter-caller)
        id: gauth
        # Google IAM has answered this with a transient 503 (25 Sep 2026, canary b);
        # one retry below, then the job fails for real.
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1012842080261/locations/global/workloadIdentityPools/github-case/providers/github
          service_account: case-minter-caller@breeze-it-tools.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://case-minter-1012842080261.asia-southeast1.run.app
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Google identity for the minter, second attempt
        id: gauth2
        if: steps.gauth.outcome == 'failure'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1012842080261/locations/global/workloadIdentityPools/github-case/providers/github
          service_account: case-minter-caller@breeze-it-tools.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://case-minter-1012842080261.asia-southeast1.run.app
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Minter client (functions only; tokens stay in step env, never on disk)
        run: |
          mkdir -p "$RUNNER_TEMP/case"
          cat > "$RUNNER_TEMP/case/minter.sh" <<'SH'
          MINTER="https://case-minter-1012842080261.asia-southeast1.run.app"
          _ghjwt() {
            curl -sS -f -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=case-minter" | jq -r .value
          }
          # minter_token -> prints an installation token for THIS repo only
          minter_token() {
            curl -sS -f -X POST "$MINTER/token" -H "Authorization: Bearer $GID" \
              -H "X-GitHub-OIDC: $(_ghjwt)" -H 'Content-Type: application/json' -d '{}' | jq -r .token
          }
          # minter_hub <get|put|append> <hub-path> [local-file] [message] -> prints the JSON reply
          minter_hub() {
            local body
            if [ -n "${3:-}" ]; then
              body=$(jq -n --arg op "$1" --arg p "$2" --arg c "$(base64 -w0 < "$3")" --arg m "${4:-}" \
                     '{op:$op,path:$p,content_b64:$c,message:$m}')
            else
              body=$(jq -n --arg op "$1" --arg p "$2" '{op:$op,path:$p}')
            fi
            curl -sS -f -X POST "$MINTER/hub" -H "Authorization: Bearer $GID" \
              -H "X-GitHub-OIDC: $(_ghjwt)" -H 'Content-Type: application/json' -d "$body"
          }
          SH

      - name: Mint repo token (this repo only; the key never leaves the minter)
        id: app-token
        env:
          GID: ${{ steps.gauth.outputs.id_token || steps.gauth2.outputs.id_token }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/case/minter.sh"
          TOK=$(minter_token)
          [ -n "$TOK" ] && [ "$TOK" != "null" ] || { echo "::error::minter returned no token"; exit 1; }
          echo "::add-mask::$TOK"
          echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0


      # ONE PR PER ISSUE (25 Sep 2026). Sarah's "Add a short README" issue got four
      # PRs in seven hours because every `/case` nudge re-ran the lane. If an open
      # CASE PR already exists for this issue, say so on the issue and stop; a
      # comment containing `/case redo` runs anyway (the human closes the old PR).
      - name: Already answered? (one open CASE PR per issue)
        id: dedupe
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          BODY: ${{ github.event.comment.body }}
          IS_ISSUE: ${{ github.event.issue && !github.event.issue.pull_request }}
        run: |
          set -uo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          [ "$IS_ISSUE" = "true" ] && [ -n "${NUM:-}" ] || exit 0
          printf '%s' "${BODY:-}" | grep -qi '/case redo' && { echo "redo requested — running"; exit 0; }
          # `gh --jq` takes ONE expression string and no --arg (7 Oct 2026, caught by the
          # Graphite review on payment_dashboard#2623): the old `--jq --arg p …` form made
          # gh exit 1, `|| true` hid it, and this guard never matched anything. NUM comes
          # from the event and is checked to be digits before it is spliced into jq.
          [[ "$NUM" =~ ^[0-9]+$ ]] || exit 0
          EXISTING=$(gh pr list -R "${{ github.repository }}" --state open --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"case/issue-${NUM}-\"))] | .[0].number // empty" 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            gh issue comment "$NUM" -R "${{ github.repository }}" --body "There is already an open CASE pull request for this issue: #${EXISTING}. Review that one; if you want it redone from scratch, comment \`/case redo\`." >/dev/null 2>&1 || true
            echo "::notice::open CASE PR #${EXISTING} already covers issue #${NUM}; nothing to do"
          fi
      - name: Write CASE permission policy (workflow-borne, run-scoped)
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/case"
          cat > "$RUNNER_TEMP/case/settings.json" <<'JSON'
          {
            "permissions": {
              "allow": [
                "Read", "Glob", "Grep", "Edit", "Write",
                "Bash(npm test:*)", "Bash(npm run:*)", "Bash(npm ci:*)", "Bash(npm install:*)",
                "Bash(npx vitest:*)", "Bash(npx jest:*)", "Bash(npx tsc:*)", "Bash(node:*)",
                "Bash(python3:*)", "Bash(pytest:*)", "Bash(python3 -m pytest:*)", "Bash(pip install:*)",
                "Bash(go test:*)", "Bash(cargo test:*)", "Bash(dotnet test:*)",
                "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)",
                "Bash(git checkout:*)", "Bash(git switch:*)", "Bash(git branch:*)",
                "Bash(git add:*)", "Bash(git commit:*)", "Bash(git push:*)",
                "Bash(gh pr create:*)", "Bash(gh pr list:*)", "Bash(gh pr view:*)",
                "Bash(gh issue list:*)", "Bash(gh issue view:*)", "Bash(gh issue comment:*)",
                "Bash(case-screenshot:*)", "Bash(npx vite:*)", "Bash(npx playwright:*)", "Bash(python3 -m http.server:*)",
                "Bash(mkdir:*)", "Bash(cp:*)", "Bash(ls:*)"
              ],
              "deny": [
                "Edit(.github/workflows/**)", "Write(.github/workflows/**)", "Read(.github/workflows/**)",
                "Read(.env)", "Read(**/.env)", "Read(**/.env.*)", "Read(.env.*)",
                "Read(**/*.pem)", "Read(**/*.key)", "Read(**/*.p12)", "Read(**/*.pfx)",
                "Read(**/.npmrc)", "Read(**/.netrc)", "Read(**/service-account*.json)",
                "Read(**/*secret*)", "Read(**/*credential*)",
                "Bash(git merge:*)", "Bash(git push --force:*)", "Bash(git push -f:*)", "Bash(git remote:*)",
                "Bash(curl:*)", "Bash(wget:*)", "Bash(nc:*)", "Bash(ncat:*)", "Bash(scp:*)",
                "WebFetch", "WebSearch"
              ]
            }
          }
          JSON

      - name: Fetch CASE memory from hub (via the minter)
        if: steps.dedupe.outputs.skip != 'true'
        env:
          GID: ${{ steps.gauth.outputs.id_token || steps.gauth2.outputs.id_token }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -uo pipefail
          . "$RUNNER_TEMP/case/minter.sh"
          mkdir -p .case
          if R=$(minter_hub get "memory/${REPO_NAME}.md") && [ "$(jq -r .found <<<"$R")" = "true" ]; then
            jq -r .content_b64 <<<"$R" | base64 -d > .case/memory.md
          else
            echo "(no memory file yet — first run)" > .case/memory.md
          fi
          cp .case/memory.md .case/memory.orig.md

      - name: Attachments directory for the agent
        # 2 Oct 2026: a requester asked CASE for a screenshot of a PR's UI change
        # (hub gap #60, Cheryl, payment_dashboard#2585) and nothing in the run
        # could carry a file out. Files the agent saves here are uploaded as an
        # artifact below, and the bot's watcher posts them into the Slack thread
        # that asked. CASE_ATTACH_DIR reaches the agent's Bash via GITHUB_ENV.
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/case-attachments"
          echo "CASE_ATTACH_DIR=$RUNNER_TEMP/case-attachments" >> "$GITHUB_ENV"

      - name: Run CASE
        if: steps.dedupe.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          trigger_phrase: "/case"
          allowed_bots: "breeze-case-bridge,breeze-case-bridge-core"
          label_trigger: "case"
          branch_prefix: "case/"
          # --strict-mcp-config: ignore any MCP servers the REPO declares (.mcp.json).
          # 1 Oct 2026: payment_dashboard's .mcp.json pointed the agent at mcp.figma.com
          # and the run tried to connect; the proxy refused it, but a repo file must not
          # be able to hand the agent a connection. The action's own --mcp-config
          # (its GitHub tools) is unaffected.
          claude_args: |
            --model ${{ vars.CASE_MODEL || 'claude-sonnet-5-5' }}
            --max-turns 50
            --strict-mcp-config
            --settings ${{ runner.temp }}/case/settings.json
            --append-system-prompt "You are CASE, a governed coding agent. You open PRs for human review and NEVER merge; branch prefix 'case/'. Do not touch .github/workflows, secrets, deploy config, or the case hub repo. If your task came from an issue (label trigger) and you completed code work: after pushing your branch you MUST open the pull request yourself with 'gh pr create' (allowlisted), titled '[CASE] ...' and including 'Closes #<issue>'. Never finish by offering a compare/create-PR link. When the request asks for a screenshot, a visual check, or what something looks like: render the change and save PNGs into ${{ runner.temp }}/case-attachments with descriptive file names. The requester receives those files in their Slack thread automatically, so name each file and say what it shows in your final comment. Build a throwaway harness outside the repo tree, under ${{ runner.temp }}, never committed and never pushed, that mounts the changed component with its hooks and data mocked; or run the repo's own dev server if it renders without credentials. Serve on localhost and capture with case-screenshot when that command exists on the runner, otherwise with npx playwright screenshot after npx playwright install chromium. Push no code unless code changes were also asked for. Never screenshot a page that shows real customer or merchant data. If your change alters anything a person sees in a browser (a component, a page, styles, copy), save screenshots of the result into ${{ runner.temp }}/case-attachments even when nobody asked for them; front-end reviewers expect to see the change before they review it, and the files you save there are posted on your pull request for you. Before you finish, your comment MUST say what you did, what you could not do, and the exact command or tool that was refused if anything was; finishing with an empty or header-only comment is a failure."

      - name: Upload attachments the agent saved (screenshots etc.)
        # 2 Oct 2026, hub gap #60: the agent writes PNGs into CASE_ATTACH_DIR
        # (step above). This ships them as a run artifact named
        # case-attachments-<run id>; the bot's stranded watcher lists a run's
        # artifacts, downloads this one, and posts the files into the requester's
        # Slack thread. Proven through the T2 proxy on the sandbox (run
        # 36971710370) before this landed. Nothing saved = no artifact, no noise.
        # Pinned to the v4 commit, same as every other third-party action here.
        if: always() && steps.dedupe.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: case-attachments-${{ github.run_id }}
          path: ${{ runner.temp }}/case-attachments
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the agent's execution log (7 days)
        # 7 Oct 2026: the agent finished sandbox issue #24 twice with a blank
        # comment and no PR, and the only record of what it did (its tool calls,
        # the two permission refusals) was claude-execution-output.json on a VM
        # that no longer existed. The action writes that file under RUNNER_TEMP;
        # this keeps it as a run artifact, same retention as the attachments, so a
        # silent finish can be read instead of guessed at. Repo-scoped like the
        # code it describes.
        if: always() && steps.dedupe.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: case-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Put the screenshots on the pull request
        # 7 Oct 2026, Kim Guan on payment_dashboard#2585: "For front-end PRs, it
        # is expected to have a screenshot of the changes before submitting for
        # review." The Slack relay reaches the requester; the reviewer reads the
        # PR. GitHub has no API for attaching an image to a comment, so the files
        # the agent saved are committed to an orphan branch `case-attachments`
        # of THIS repo under <run id>/ (every reviewer of the PR can already read
        # the repo, so nothing new is granted and no other repo is involved) and
        # the PR gets one comment that renders them. The agent never touches that
        # branch; this step does, after the agent is done, with the same repo
        # token. The comment carries no "/case", so it cannot re-trigger this
        # workflow. Nothing saved, or no PR to attach to = nothing posted. Never
        # fails the run.
        if: steps.dedupe.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          ON_PR: ${{ (github.event.issue.pull_request || github.event.pull_request) && 'true' || 'false' }}
        run: |
          set -uo pipefail
          DIR="$RUNNER_TEMP/case-attachments"
          [ -d "$DIR" ] || { echo "no attachments directory"; exit 0; }
          mapfile -t FILES < <(find "$DIR" -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' \) -size -8M | sort | head -12)
          [ "${#FILES[@]}" -gt 0 ] || { echo "no screenshots saved"; exit 0; }
          if [ "$ON_PR" = "true" ]; then
            PR="$NUM"
          else
            [[ "$NUM" =~ ^[0-9]+$ ]] || { echo "issue number is not numeric; nothing to attach to"; exit 0; }
            # gh --jq takes one expression string and no --arg (7 Oct 2026, Graphite review on pd#2623).
            PR=$(gh pr list -R "$REPO" --state open --json number,headRefName \
                 --jq "[.[] | select(.headRefName | startswith(\"case/issue-${NUM}-\"))] | .[0].number // empty" 2>/dev/null || true)
          fi
          [ -n "${PR:-}" ] || { echo "no open CASE pull request for #${NUM}; the screenshots stay on the run page"; exit 0; }
          W="$RUNNER_TEMP/case-shots"; rm -rf "$W"; mkdir -p "$W"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          G() { git -C "$W" -c "http.https://github.com/.extraheader=$AUTH" -c user.name=CASE -c user.email=case@users.noreply.github.com "$@"; }
          G init -q
          G remote add origin "https://github.com/${REPO}.git"
          if G fetch -q --depth=1 origin case-attachments 2>/dev/null; then
            G checkout -q -b case-attachments FETCH_HEAD
          else
            G checkout -q --orphan case-attachments
          fi
          mkdir -p "$W/$RUN_ID"
          cp "${FILES[@]}" "$W/$RUN_ID/"
          G add "$RUN_ID"
          G commit -q -m "CASE screenshots, run ${RUN_ID}, PR #${PR}" || { echo "nothing to commit"; exit 0; }
          G push -q origin HEAD:case-attachments || { echo "::warning::could not push the screenshots branch"; exit 0; }
          BODY="Screenshots from this run (${RUN_URL}), saved by CASE so the change can be seen before review:"
          for f in "${FILES[@]}"; do
            n=$(basename "$f")
            BODY="${BODY}"$'\n\n'"**${n}**"$'\n'"![${n}](https://github.com/${REPO}/blob/case-attachments/${RUN_ID}/${n}?raw=true)"
          done
          gh api "repos/${REPO}/issues/${PR}/comments" -f body="$BODY" >/dev/null \
            || echo "::warning::could not post the screenshot comment"

      - name: Sync CASE memory + ledger to hub (via the minter; policed paths)
        if: always() && steps.dedupe.outputs.skip != 'true' && (steps.gauth.outputs.id_token != '' || steps.gauth2.outputs.id_token != '')
        env:
          GID: ${{ steps.gauth.outputs.id_token || steps.gauth2.outputs.id_token }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Write-back is non-critical: a hiccup logs a ::warning:: but never reds the run.
          set -uo pipefail
          . "$RUNNER_TEMP/case/minter.sh"
          if [ -f .case/memory.md ] && ! cmp -s .case/memory.md .case/memory.orig.md; then
            minter_hub put "memory/${REPO_NAME}.md" .case/memory.md "run ${{ github.run_id }}" >/dev/null \
              && echo "hub: memory updated" || echo "::warning::hub memory write failed"
          fi
          if [ -s .case/ledger-row.md ]; then
            minter_hub append "ledger.md" .case/ledger-row.md "run ${{ github.run_id }}" >/dev/null \
              && echo "hub: ledger appended" || echo "::warning::hub ledger append failed"
          fi

      - name: Report run failure on the triggering thread
        # Closes the silent-death gap: if any step above failed, tell the
        # requester on the issue/PR that summoned CASE. Posts as the breeze-case
        # App (repo-scoped token) — body has no "/case", so it cannot self-trigger.
        # Runs on ANY failure, including one before a token was minted (25 Sep 2026,
        # canary b: the WIF step died and this step was skipped, so the requester
        # saw nothing). Falls back to the job's own token, which can comment on
        # issues; a comment from github-actions[bot] carries no "/case" so it
        # cannot re-trigger this workflow.
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          NUM="${{ github.event.issue.number || github.event.pull_request.number }}"
          [ -z "$NUM" ] && exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh api "repos/${{ github.repository }}/issues/${NUM}/comments" \
            -f body="CASE run failed: ${RUN_URL} — the request did not complete. cc the requester if one is named in the issue body." >/dev/null \
            || echo "::warning::could not post failure comment"
