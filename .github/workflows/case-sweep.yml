# CASE — nightly autonomous sweep (HARDENED Jun 16; MINTER 25 Sep 2026).
# No App private key lives in this repo any more. The job proves who it is with
# its GitHub OIDC token and asks the CASE minter (Cloud Run, breeze-it-tools,
# IAM-gated) for an installation token for THIS repo only; the hub reads it
# needs (its own memory file, the sweep directive) and the hub writes it makes
# (its own memory file, a ledger append) go through the minter on a per-lane
# path allowlist. The agent runs with the repo token and never holds anything
# that reaches the hub or another repo. Rails ride in this workflow.
# Cron staggered per repo + UTC. 18:xx UTC Sun-Thu = 02:xx SGT Mon-Fri.
name: CASE nightly sweep

on:
  schedule:
    - cron: "6 18 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write   # the OIDC token IS the credential now (WIF + minter)

concurrency:
  group: case-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Google identity for the minter (WIF → case-minter-caller)
        id: gauth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1012842080261/locations/global/workloadIdentityPools/github-case/providers/github
          service_account: case-minter-caller@breeze-it-tools.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://case-minter-1012842080261.asia-southeast1.run.app
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Minter client (functions only; tokens stay in step env, never on disk)
        run: |
          mkdir -p "$RUNNER_TEMP/case"
          cat > "$RUNNER_TEMP/case/minter.sh" <<'SH'
          MINTER="https://case-minter-1012842080261.asia-southeast1.run.app"
          _ghjwt() {
            curl -sS -f -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=case-minter" | jq -r .value
          }
          # minter_token -> prints an installation token for THIS repo only
          minter_token() {
            curl -sS -f -X POST "$MINTER/token" -H "Authorization: Bearer $GID" \
              -H "X-GitHub-OIDC: $(_ghjwt)" -H 'Content-Type: application/json' -d '{}' | jq -r .token
          }
          # minter_hub <get|put|append> <hub-path> [local-file] [message] -> prints the JSON reply
          minter_hub() {
            local body
            if [ -n "${3:-}" ]; then
              body=$(jq -n --arg op "$1" --arg p "$2" --arg c "$(base64 -w0 < "$3")" --arg m "${4:-}" \
                     '{op:$op,path:$p,content_b64:$c,message:$m}')
            else
              body=$(jq -n --arg op "$1" --arg p "$2" '{op:$op,path:$p}')
            fi
            curl -sS -f -X POST "$MINTER/hub" -H "Authorization: Bearer $GID" \
              -H "X-GitHub-OIDC: $(_ghjwt)" -H 'Content-Type: application/json' -d "$body"
          }
          # minter_hub_get <hub-path> <local-file> <fallback-text> -> writes the file (fallback when absent)
          minter_hub_get() {
            local reply
            reply=$(minter_hub get "$1") || { printf '%s\n' "$3" > "$2"; return 0; }
            if [ "$(printf '%s' "$reply" | jq -r .found)" = "true" ]; then
              printf '%s' "$reply" | jq -r .content_b64 | base64 -d > "$2"
            else
              printf '%s\n' "$3" > "$2"
            fi
          }
          SH

      - name: Mint repo token (the agent runs with THIS — this repo only, no hub)
        id: app-token
        env:
          GID: ${{ steps.gauth.outputs.id_token }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/case/minter.sh"
          TOK=$(minter_token)
          [ -n "$TOK" ] && [ "$TOK" != "null" ] || { echo "::error::minter returned no token"; exit 1; }
          echo "::add-mask::$TOK"
          echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Backpressure check
        id: backpressure
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OPEN=$(gh pr list -R "${{ github.repository }}" --label case --state open --json number --jq 'length' 2>/dev/null || echo 0)
          # A non-numeric result (empty string on a transient gh/auth blip)
          # makes `[ "$OPEN" -ge 2 ]` throw "integer expression expected" and,
          # inside `if`, evaluate false — the sweep would then RUN and create a
          # PR on a bad read. Force any non-numeric value to the skip threshold
          # so a failed read backs off instead.
          case "$OPEN" in ''|*[!0-9]*) OPEN=2 ;; esac
          echo "open=$OPEN" >> "$GITHUB_OUTPUT"
          if [ "$OPEN" -ge 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CASE sweep skipped — $OPEN open CASE PRs awaiting review."
          fi

      - uses: actions/checkout@v6
        if: steps.backpressure.outputs.skip != 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Write CASE permission policy (workflow-borne, run-scoped)
        if: steps.backpressure.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/case"
          cat > "$RUNNER_TEMP/case/settings.json" <<'JSON'
          {
            "permissions": {
              "allow": [
                "Read", "Glob", "Grep", "Edit", "Write",
                "Bash(npm test:*)", "Bash(npm run:*)", "Bash(npm ci:*)", "Bash(npm install:*)",
                "Bash(npx vitest:*)", "Bash(npx jest:*)", "Bash(npx tsc:*)", "Bash(node:*)",
                "Bash(python3:*)", "Bash(pytest:*)", "Bash(python3 -m pytest:*)", "Bash(pip install:*)",
                "Bash(go test:*)", "Bash(cargo test:*)", "Bash(dotnet test:*)",
                "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(git show:*)",
                "Bash(git checkout:*)", "Bash(git switch:*)", "Bash(git branch:*)",
                "Bash(git add:*)", "Bash(git commit:*)", "Bash(git push:*)",
                "Bash(gh pr create:*)", "Bash(gh pr list:*)", "Bash(gh pr view:*)",
                "Bash(gh issue list:*)", "Bash(gh issue view:*)", "Bash(gh issue comment:*)"
              ],
              "deny": [
                "Edit(.github/workflows/**)", "Write(.github/workflows/**)", "Read(.github/workflows/**)",
                "Read(.env)", "Read(**/.env)", "Read(**/.env.*)", "Read(.env.*)",
                "Read(**/*.pem)", "Read(**/*.key)", "Read(**/*.p12)", "Read(**/*.pfx)",
                "Read(**/.npmrc)", "Read(**/.netrc)", "Read(**/service-account*.json)",
                "Read(**/*secret*)", "Read(**/*credential*)",
                "Bash(git merge:*)", "Bash(git push --force:*)", "Bash(git push -f:*)", "Bash(git remote:*)",
                "Bash(curl:*)", "Bash(wget:*)", "Bash(nc:*)", "Bash(ncat:*)", "Bash(scp:*)",
                "WebFetch", "WebSearch"
              ]
            }
          }
          JSON

      - name: Fetch CASE memory + sweep directive from hub (through the minter)
        if: steps.backpressure.outputs.skip != 'true'
        env:
          GID: ${{ steps.gauth.outputs.id_token }}
          REPO_NAME: ${{ steps.repo.outputs.name }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/case/minter.sh"
          mkdir -p .case
          minter_hub_get "memory/${REPO_NAME}.md" .case/memory.md "(no memory file yet — first run)"
          cp .case/memory.md .case/memory.orig.md
          minter_hub_get "prompts/sweep.md" .case/sweep.md "(no sweep directive found)"

      - name: Run CASE sweep
        if: steps.backpressure.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          branch_prefix: "case/"
          track_progress: false
          prompt: |
            You are CASE on your nightly sweep of ${{ github.repository }}.
            Read .case/sweep.md and follow it exactly. Your memory for this
            repo is .case/memory.md. Open PRs with `gh pr create` (you are
            authenticated). One bounded PR maximum tonight; a clean skip is
            a valid outcome. Do not touch .github/workflows, secrets, deploy
            config, or the case hub repo.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 80
            --settings ${{ runner.temp }}/case/settings.json

      - name: Sync CASE memory + ledger to hub (through the minter)
        if: always() && steps.backpressure.outputs.skip != 'true' && steps.gauth.outputs.id_token != ''
        env:
          GID: ${{ steps.gauth.outputs.id_token }}
          REPO_NAME: ${{ steps.repo.outputs.name }}
        run: |
          # Write-back is non-critical: a hiccup logs a ::warning:: but never reds the run.
          . "$RUNNER_TEMP/case/minter.sh"
          if [ -f .case/memory.md ] && ! cmp -s .case/memory.md .case/memory.orig.md; then
            minter_hub put "memory/${REPO_NAME}.md" .case/memory.md "sweep ${{ github.run_id }}" >/dev/null \
              && echo "hub: memory updated" || echo "::warning::hub memory update failed"
          fi
          if [ -s .case/ledger-row.md ]; then
            minter_hub append "ledger.md" .case/ledger-row.md "sweep ${{ github.run_id }}" >/dev/null \
              && echo "hub: ledger appended" || echo "::warning::hub ledger append failed"
          fi
