          TEXT="Done — <${PR_URL}|PR #${PR_NUM}> is merged. If this tool auto-deploys, your change is rolling out now."
          FN="notify/queue/$(echo "$GITHUB_REPOSITORY" | tr '/' '-')-pr${PR_NUM}-${GITHUB_RUN_ID}-merged.json"
          B64=$(jq -n --arg c "$CH" --arg t "$TH" --arg x "$TEXT" '{channel:$c,thread:$t,text:$x}' | base64 -w0)
