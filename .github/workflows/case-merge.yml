          echo "::add-mask::$TOK"
          echo "token=$TOK" >> "$GITHUB_OUTPUT"


      - name: Verify tier labels (C3 never merges here)
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if printf '%s' "$LABELS" | jq -e 'index("case-c3")' >/dev/null; then
            echo "::error::PR is tier C3 — human review required; a confirmation label cannot merge it."
            exit 1
          fi
          if ! printf '%s' "$LABELS" | jq -e '(index("case-c1")) or (index("case-c2"))' >/dev/null; then
