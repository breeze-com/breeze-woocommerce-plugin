          { [ -n "$CH" ] && [ -n "$TH" ]; } || exit 0
          # Name the failed step: the test gate is the usual one.
          STEP=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | first // "a step"' 2>/dev/null || echo "a step")
          MENTION=""; [ -n "$RQ" ] && MENTION="<@${RQ}> "
          TEXT="${MENTION}I couldn't merge <${PR_URL}|PR #${PR_NUM}>: the \"${STEP}\" step failed, so nothing changed. Ask me what went wrong and I'll read the log, or an engineer with write access can merge it on GitHub."
          FN="notify/queue/$(echo "$GITHUB_REPOSITORY" | tr '/' '-')-pr${PR_NUM}-${GITHUB_RUN_ID}-failed.json"
          B64=$(jq -n --arg c "$CH" --arg t "$TH" --arg x "$TEXT" '{channel:$c,thread:$t,text:$x}' | base64 -w0)
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/case/queue.json"
          minter_hub put "${FN}" "$RUNNER_TEMP/case/queue.json" "notify" >/dev/null \
            || echo "::warning::notify relay failed"
